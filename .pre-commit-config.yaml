repos:
  - repo: local
    hooks:
      - id: terraform-docs
        name: terraform-docs
        entry: terraform-docs markdown .
        language: system
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.1.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
