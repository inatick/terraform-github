# Pre-commit hooks for terraform-github (OpenTofu). CI runs the same hooks.
# Install: pip install pre-commit && pre-commit install
default_install_hook_types:
  - pre-commit
  - commit-msg
# Hooks without their own `stages` run only at pre-commit, not again at
# commit-msg (conventional-pre-commit sets stages: [commit-msg] itself).
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/tofuutils/pre-commit-opentofu
    rev: v2.4.2
    hooks:
      - id: tofu_fmt
      - id: tofu_validate
      - id: tofu_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  # terraform-docs via the Makefile, so the BEGIN_TF_DOCS markers and
  # .terraform-docs.yml are honoured (the tofu_docs hook uses its own markers).
  - repo: local
    hooks:
      - id: terraform-docs
        name: terraform-docs (make docs)
        entry: make docs
        language: system
        files: (\.tf|\.terraform-docs\.yml)$
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
