version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Provider constraints in the modules and the example's lock file.
  - package-ecosystem: terraform
    directories:
      - /examples
      - /organization
      - /repository
      - /repositories
      - /branch_protection
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: chore
    groups:
      terraform-providers:
        patterns: ["*"]

  # Release tooling only (semantic-release).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    versioning-strategy: increase
    ignore:
      # conventional-changelog-conventionalcommits 10.x needs
      # conventional-changelog-writer 9, but
      # @semantic-release/release-notes-generator 14.x still uses writer 8, so
      # release notes fail to render. Remove this once release-notes-generator
      # depends on conventional-changelog-writer >= 9.
      - dependency-name: conventional-changelog-conventionalcommits
        versions: [">=10.0.0"]
    groups:
      semantic-release:
        patterns: ["*"]
