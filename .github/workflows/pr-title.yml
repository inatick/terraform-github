# PRs are squash-merged, so the PR title becomes the commit message on main
# and decides the next version for semantic-release:
#   fix: -> patch, feat: -> minor, feat!: or a BREAKING CHANGE footer -> major.

name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
